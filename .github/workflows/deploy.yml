name: Deploy Hotel Reservation to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::468683594609:role/HotelReservationGitHubActions
          aws-region: eu-north-1

      - name: Deploy to EC2
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0074113fbeaadc1be \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo -u ubuntu -H bash -lc '\''set -e; cd /home/ubuntu/Hotel-Reservation; git fetch origin; git reset --hard origin/main; npm install; cd client; npm install; NODE_OPTIONS=\"--max-old-space-size=768\" npm run build; cd ..; pm2 restart hotel-reservation --update-env'\''"
            ]' \
            --region eu-north-1 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0074113fbeaadc1be \
              --region eu-north-1 \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-0074113fbeaadc1be \
                  --region eu-north-1
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment timed out waiting for SSM command."
          exit 1
